<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<linearGradient id="bg" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#11785A"/><stop offset=".55" stop-color="#033023"/><stop offset="1" stop-color="#011A13"/>
</linearGradient>
<linearGradient id="gold" x1="150" y1="90" x2="380" y2="420" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#FFF4D6"/><stop offset=".3" stop-color="#EBCB83"/><stop offset=".65" stop-color="#C99A3D"/><stop offset="1" stop-color="#8F6420"/>
</linearGradient>
<radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(150 96) scale(330)" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
<clipPath id="kclip"><rect x="0" y="178" width="512" height="168"/></clipPath>
<!-- Half-plane below the arm's centre line, so the leg starts hidden under the arm. -->
<clipPath id="legclip"><polygon points="100,392 420,57 600,57 600,600 100,600"/></clipPath>
<filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity=".38"/>
</filter>
</defs>
<rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>
<rect x="24" y="24" width="464" height="464" rx="116" fill="url(#sheen)"/>
<rect x="40" y="40" width="432" height="432" rx="102" fill="none" stroke="url(#gold)" stroke-opacity=".45" stroke-width="2"/>
<g filter="url(#lift)">
<path d="M 321.93 98.82 A 176 176 0 1 1 190.07 98.82" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
<circle cx="256" cy="86" r="14" fill="url(#gold)"/>
</g>
<g filter="url(#lift)"><g transform="translate(256 262) scale(1.04) translate(-256 -262)" clip-path="url(#kclip)">
<rect x="182" y="178" width="32" height="168" fill="url(#gold)"/>
<line x1="188" y1="300" x2="322" y2="160" stroke="url(#gold)" stroke-width="11"/>
<line x1="230" y1="244" x2="332" y2="366" stroke="url(#gold)" stroke-width="30" clip-path="url(#legclip)"/>
</g></g>
</svg>