<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepActive lockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    width: max-content;
    height: 600px;
    overflow: hidden;
    font-family: "Inter", "Segoe UI Variable Display", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    padding: 0 96px;
  }
  .mark { width: 300px; height: 300px; flex: 0 0 300px; }
  .mark img { width: 100%; height: 100%; display: block; }
  .type { margin-left: 70px; padding-top: 6px; }
  .word {
    font-size: 160px;
    line-height: .88;
    font-weight: 600;
    letter-spacing: -0.052em;
    color: #08251E;
    white-space: nowrap;
  }
  .tag {
    margin-top: 30px;
    padding-left: 6px;
    font-size: 21px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: .235em;
    text-transform: uppercase;
    color: #8F6420;
  }
  .rule {
    margin-top: 26px;
    margin-left: 6px;
    width: 72px;
    height: 2px;
    background: #C99A3D;
  }
  body.dark .word { color: #F4F0E5; }
  body.dark .tag { color: #E3C27F; }
  body.dark .rule { background: #C99A3D; }
  body.cream { background: #F5F1E8; }
  body.forest { background: #061A15; }
</style>
</head>
<body>
  <div class="mark"><img src="keepactive-mark.svg" alt="KeepActive K monogram"></div>
  <div class="type">
    <div class="word">KeepActive</div>
    <div class="tag">Quietly active</div>
    <div class="rule"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const bg = params.get('bg');
    if (params.get('theme') === 'dark' || bg === 'forest') {
      document.body.classList.add('dark');
    }
    if (bg === 'cream') document.body.classList.add('cream');
    if (bg === 'forest') document.body.classList.add('forest');
  </script>
</body>
</html>
