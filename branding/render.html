<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepActive icon renderer</title>
</head>
<body>
<script>
  /*
   * Production renderer for the KeepActive "Crimson & Cream" mark.
   *
   * A flat, stencil-cut K: a solid stem and a single mitred chevron separated
   * by a hairline of negative space, in cream on a crimson superellipse tile.
   * No glows, bevels or drop shadows; only a near-imperceptible tile gradient
   * and a top-edge highlight at 48 px and above.
   *
   * Optical sizes: 16/32 px use heavier strokes, a wider cut and a slightly
   * larger mark so the gap survives toolbar rasterization.
   */

  const PALETTES = {
    // Active
    green: { top: '#B02536', bottom: '#8A1626', mark: '#F6EDDF', markOpacity: 1 },
    // Paused / off-schedule
    dim: { top: '#9C9084', bottom: '#7D7268', mark: '#F6EDDF', markOpacity: 0.92 },
    // Disabled
    red: { top: '#3D3532', bottom: '#2A2422', mark: '#F6EDDF', markOpacity: 0.55 }
  };

  // Apple-style superellipse tile, |x|^n + |y|^n = r^n.
  function squirclePath(cx, cy, r, n = 5, steps = 192) {
    const pts = [];
    for (let i = 0; i < steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      const c = Math.cos(t), s = Math.sin(t);
      const x = cx + r * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
      const y = cy + r * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
      pts.push(`${x.toFixed(2)} ${y.toFixed(2)}`);
    }
    return `M ${pts.join(' L ')} Z`;
  }

  /**
   * Stem + chevron K, centred on (256,256).
   * s = stem width, w = chevron band width, g = cut between them, h = cap height.
   */
  function monogram({ s, w, g, h }) {
    const top = 256 - h / 2, bottom = 256 + h / 2;
    const slope = 124 / 144;                          // arm dx per dy
    const sinT = Math.sin(Math.atan2(144, 124));      // arm angle from horizontal
    const vx = 0;                                     // provisional vertex x
    const miterLeft = vx - (w / 2) / sinT;
    const stemRight = miterLeft - g;
    const stemLeft = stemRight - s;
    const right = vx + (h / 2) * slope + (w / 2) / sinT;
    const dx = 256 - (stemLeft + right) / 2;          // centre the whole mark

    const X = v => (v + dx).toFixed(2);
    const ext = 40;                                   // arms overshoot, then clip flat
    const armDx = (h / 2 + ext) * slope;
    return `
      <clipPath id="cap"><rect x="0" y="${top}" width="512" height="${h}"/></clipPath>
      <rect x="${X(stemLeft)}" y="${top}" width="${s}" height="${h}" rx="${(s * 0.08).toFixed(2)}"/>
      <polyline clip-path="url(#cap)" fill="none" stroke-width="${w}" stroke-linejoin="miter" stroke-miterlimit="8"
        points="${X(vx + armDx)},${top - ext} ${X(vx)},256 ${X(vx + armDx)},${bottom + ext}"/>`;
  }

  function buildSvg(state, size) {
    const p = PALETTES[state] || PALETTES.green;
    const tiny = size <= 16;
    const compact = size <= 32;

    const k = tiny ? { s: 78, w: 84, g: 40, h: 288 }
      : compact ? { s: 70, w: 74, g: 30, h: 272 }
      : { s: 58, w: 60, g: 22, h: 236 };

    const highlight = compact ? '' : `
      <path d="${squirclePath(256, 256, 231)}" fill="none" stroke="url(#hl)" stroke-width="3"/>`;

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
      <defs>
        <linearGradient id="bg" x1="0" y1="24" x2="0" y2="488" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="${p.top}"/><stop offset="1" stop-color="${p.bottom}"/>
        </linearGradient>
        <linearGradient id="hl" x1="0" y1="24" x2="0" y2="200" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${squirclePath(256, 256, 232)}" fill="url(#bg)"/>
      ${highlight}
      <g fill="${p.mark}" stroke="${p.mark}" opacity="${p.markOpacity}">
        <g stroke="none">${monogram(k).split('<polyline')[0]}</g>
        <polyline${monogram(k).split('<polyline')[1]}
      </g>
    </svg>`;
  }

  function svgUrl(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  async function renderSvg(svg, size) {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('SVG load failed'));
      img.src = svgUrl(svg);
    });
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    return canvas.toDataURL('image/png');
  }

  async function renderIcon(state, size) {
    // Render 4x then downsample for cleaner small sizes.
    const big = await renderSvg(buildSvg(state, size), size * 4);
    const img = new Image();
    await new Promise(r => { img.onload = r; img.src = big; });
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, size, size);
    return canvas.toDataURL('image/png');
  }
</script>
</body>
</html>
