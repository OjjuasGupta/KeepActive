<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepActive icon renderer</title>
</head>
<body>
<script>
  /*
   * Production renderer for the KeepActive "Emerald & Gold" mark.
   *
   * A high-contrast gold K (heavy stem and leg, hairline arm) sits inside an
   * open gold ring whose gap holds a single gold dot — an "always on"
   * indicator — on a deep emerald squircle with a champagne hairline bevel.
   *
   * Optical sizes: 48/128+ use the full mark. 32 thickens every stroke.
   * 16 drops the ring and enlarges the K so it survives toolbar rasterizing.
   * State variants keep the gold and change only the tile: emerald (active),
   * slate (paused / off-schedule), garnet (disabled).
   */

  const GOLD = {
    full: ['#FFF4D6', '#EBCB83', '#C99A3D', '#8F6420'],
    muted: ['#F1EADB', '#CFC0A0', '#A99568', '#6F6243']
  };

  const PALETTES = {
    green: { bg1: '#11785A', bg2: '#033023', bg3: '#011A13', gold: GOLD.full, sheen: 0.16 },
    dim:   { bg1: '#3E5A51', bg2: '#1C2B26', bg3: '#0E1714', gold: GOLD.muted, sheen: 0.08 },
    red:   { bg1: '#7A1F33', bg2: '#3A0A16', bg3: '#1E040A', gold: GOLD.full, sheen: 0.12 }
  };

  // Ring geometry: centre (256,262), gap of 44° centred at 12 o'clock.
  const CX = 256, CY = 262;
  function ringPath(r) {
    const a1 = (-90 + 22) * Math.PI / 180;
    const a2 = (-90 - 22) * Math.PI / 180;
    const p = a => `${(CX + r * Math.cos(a)).toFixed(2)} ${(CY + r * Math.sin(a)).toFixed(2)}`;
    return `M ${p(a1)} A ${r} ${r} 0 1 1 ${p(a2)}`;
  }

  function monogram(w, scale, shadow) {
    // w = {stem, leg, arm} stroke widths. Clip gives horizontal terminals.
    const t = scale === 1 ? '' : ` transform="translate(${CX} ${CY}) scale(${scale}) translate(${-CX} ${-CY})"`;
    const f = shadow ? ' filter="url(#lift)"' : '';
    return `<g${f}><g${t} clip-path="url(#kclip)">
      <rect x="${198 - w.stem / 2}" y="178" width="${w.stem}" height="168" fill="url(#gold)"/>
      <line x1="188" y1="300" x2="322" y2="160" stroke="url(#gold)" stroke-width="${w.arm}"/>
      <line x1="230" y1="244" x2="332" y2="366" stroke="url(#gold)" stroke-width="${w.leg}" clip-path="url(#legclip)"/>
    </g></g>`;
  }

  function buildSvg(state, size) {
    const p = PALETTES[state] || PALETTES.green;
    const g = p.gold;
    const tiny = size <= 16;
    const compact = size <= 32;

    const weights = tiny
      ? { stem: 52, leg: 50, arm: 30 }
      : compact ? { stem: 40, leg: 38, arm: 20 } : { stem: 32, leg: 30, arm: 11 };
    const kScale = tiny ? 1.32 : compact ? 1.1 : 1.04;
    const ringW = compact ? 22 : 10;
    const dotR = compact ? 20 : 14;

    const ring = tiny ? '' : `
      <g${compact ? '' : ' filter="url(#lift)"'}>
      <path d="${ringPath(176)}" fill="none" stroke="url(#gold)" stroke-width="${ringW}" stroke-linecap="round"/>
      <circle cx="${CX}" cy="${CY - 176}" r="${dotR}" fill="url(#gold)"/>
      </g>`;

    const decor = compact ? '' : `
      <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#sheen)"/>
      <rect x="40" y="40" width="432" height="432" rx="102" fill="none" stroke="url(#gold)" stroke-opacity=".45" stroke-width="2"/>`;

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
      <defs>
        <linearGradient id="bg" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="${p.bg1}"/><stop offset=".55" stop-color="${p.bg2}"/><stop offset="1" stop-color="${p.bg3}"/>
        </linearGradient>
        <linearGradient id="gold" x1="150" y1="90" x2="380" y2="420" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="${g[0]}"/><stop offset=".3" stop-color="${g[1]}"/><stop offset=".65" stop-color="${g[2]}"/><stop offset="1" stop-color="${g[3]}"/>
        </linearGradient>
        <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(150 96) scale(330)" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="${p.sheen}"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="kclip"><rect x="0" y="178" width="512" height="168"/></clipPath>
        <!-- Half-plane below the arm's centre line, so the leg starts hidden under the arm. -->
        <clipPath id="legclip"><polygon points="100,392 420,57 600,57 600,600 100,600"/></clipPath>
        <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity=".38"/>
        </filter>
      </defs>
      <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>
      ${decor}
      ${ring}
      ${monogram(weights, kScale, !compact)}
    </svg>`;
  }

  function svgUrl(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  async function renderSvg(svg, size) {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('SVG load failed'));
      img.src = svgUrl(svg);
    });
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    return canvas.toDataURL('image/png');
  }

  async function renderIcon(state, size) {
    // Render 4x then downsample for cleaner small sizes.
    const big = await renderSvg(buildSvg(state, size), size * 4);
    const img = new Image();
    await new Promise(r => { img.onload = r; img.src = big; });
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, size, size);
    return canvas.toDataURL('image/png');
  }
</script>
</body>
</html>
