<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepActive icon renderer</title>
</head>
<body>
<script>
  /*
   * Production renderer for the KeepActive "Presence" mark.
   *
   * A cream disc with a status badge cut into its upper-right shoulder, on a
   * crimson superellipse tile. The badge carries the state:
   *   active  -> solid dot   (crimson tile)
   *   paused  -> ring        (stone tile)
   *   off     -> empty notch (charcoal tile, dimmed disc)
   *
   * Flat by design: one subtle vertical tile gradient and, at 48 px and up,
   * a faint top-edge highlight. 16/32 px use a larger disc and wider notch so
   * the badge stays separated after toolbar rasterization.
   */

  const CREAM = '#F6EDDF';
  const PALETTES = {
    green: { top: '#B02536', bottom: '#8A1626', mark: CREAM, opacity: 1, badge: 'dot' },
    dim: { top: '#9C9084', bottom: '#7D7268', mark: CREAM, opacity: 0.95, badge: 'ring' },
    red: { top: '#3D3532', bottom: '#2A2422', mark: CREAM, opacity: 0.6, badge: 'none' }
  };

  // Superellipse tile, |x|^n + |y|^n = r^n.
  function squirclePath(cx, cy, r, n = 5, steps = 192) {
    const pts = [];
    for (let i = 0; i < steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      const c = Math.cos(t), s = Math.sin(t);
      const x = cx + r * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
      const y = cy + r * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
      pts.push(`${x.toFixed(2)} ${y.toFixed(2)}`);
    }
    return `M ${pts.join(' L ')} Z`;
  }

  function geometry(size) {
    if (size <= 16) return { R: 166, cx: 242, cy: 270, cut: 82, dot: 50, ring: 22 };
    if (size <= 32) return { R: 156, cx: 244, cy: 268, cut: 74, dot: 46, ring: 20 };
    return { R: 146, cx: 240, cy: 272, cut: 66, dot: 40, ring: 16 };
  }

  function buildSvg(state, size) {
    const p = PALETTES[state] || PALETTES.green;
    const g = geometry(size);
    const bx = (g.cx + g.R * 0.72).toFixed(2);
    const by = (g.cy - g.R * 0.72).toFixed(2);

    let badge = '';
    if (p.badge === 'dot') {
      badge = `<circle cx="${bx}" cy="${by}" r="${g.dot}" fill="${p.mark}"/>`;
    } else if (p.badge === 'ring') {
      badge = `<circle cx="${bx}" cy="${by}" r="${g.dot - g.ring / 2}" fill="none" stroke="${p.mark}" stroke-width="${g.ring}"/>`;
    }

    const highlight = size <= 32 ? '' : `
      <path d="${squirclePath(256, 256, 231)}" fill="none" stroke="url(#hl)" stroke-width="3"/>`;

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
      <defs>
        <linearGradient id="bg" x1="0" y1="24" x2="0" y2="488" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="${p.top}"/><stop offset="1" stop-color="${p.bottom}"/>
        </linearGradient>
        <linearGradient id="hl" x1="0" y1="24" x2="0" y2="200" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <mask id="notch">
          <rect width="512" height="512" fill="#FFFFFF"/>
          <circle cx="${bx}" cy="${by}" r="${g.cut}" fill="#000000"/>
        </mask>
      </defs>
      <path d="${squirclePath(256, 256, 232)}" fill="url(#bg)"/>
      ${highlight}
      <g opacity="${p.opacity}">
        <circle cx="${g.cx}" cy="${g.cy}" r="${g.R}" fill="${p.mark}" mask="url(#notch)"/>
        ${badge}
      </g>
    </svg>`;
  }

  function svgUrl(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  async function renderSvg(svg, size) {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('SVG load failed'));
      img.src = svgUrl(svg);
    });
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    return canvas.toDataURL('image/png');
  }

  async function renderIcon(state, size, options = {}) {
    // Render 4x then downsample for cleaner small sizes.
    const big = await renderSvg(buildSvg(state, size), size * 4);
    const img = new Image();
    await new Promise(r => { img.onload = r; img.src = big; });
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (options.storePadding) {
      // Chrome Web Store: 96x96 artwork + 16 px transparent padding per side
      // at 128 px. The tile spans 464 of 512 units, so scale it to 96/128.
      const art = size * 0.75;
      const drawn = art * 512 / 464;
      const offset = (size - drawn) / 2;
      ctx.drawImage(img, offset, offset, drawn, drawn);
    } else {
      ctx.drawImage(img, 0, 0, size, size);
    }
    return canvas.toDataURL('image/png');
  }
</script>
</body>
</html>
