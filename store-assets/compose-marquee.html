<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepActive marquee promo tile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1400px; height: 560px; overflow: hidden; }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: #f6f4ee;
    color: #1c1917;
    position: relative;
  }
  .glow-a, .glow-b { position: absolute; border-radius: 50%; }
  .glow-a {
    width: 900px; height: 900px; right: -220px; top: -420px;
    background: radial-gradient(circle, rgba(16,185,129,0.18), rgba(16,185,129,0) 66%);
  }
  .glow-b {
    width: 700px; height: 700px; left: -300px; bottom: -420px;
    background: radial-gradient(circle, rgba(176,37,54,0.10), rgba(176,37,54,0) 68%);
  }
  .copy { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); width: 760px; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 64px; height: 64px; padding: 8px; border-radius: 17px;
    background: #fff; border: 1px solid #e7e2d6; box-shadow: 0 10px 24px rgba(41,37,36,0.12);
  }
  .mark img { width: 100%; height: 100%; display: block; }
  .brand span { font-size: 30px; font-weight: 750; letter-spacing: -0.03em; }
  h1 { margin-top: 28px; font-size: 60px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 750; }
  h1 span { color: #059669; }
  .lede { margin-top: 22px; font-size: 20px; line-height: 1.5; color: #57534e; max-width: 580px; }
  .meta {
    margin-top: 30px; display: inline-flex; align-items: center; gap: 9px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #047857;
    background: #ecfdf5; border: 1px solid #a7f3d0; padding: 8px 14px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }
  .stage { position: absolute; right: 90px; top: 54%; width: 440px; transform: translateY(-50%); perspective: 1600px; z-index: 2; }
  .device {
    transform: rotateY(-14deg) rotateX(4deg);
    border-radius: 22px; overflow: hidden; background: #f6f4ee;
    box-shadow: 0 40px 80px rgba(41,37,36,0.22), 0 10px 24px rgba(41,37,36,0.10), 0 0 0 1px rgba(28,25,23,0.06);
  }
  .device img { display: block; width: 100%; height: 470px; object-fit: cover; object-position: top; }
  .device { -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, #000 78%, transparent 100%); }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="copy">
    <div class="brand"><div class="mark"><img src="../icons/icon128.png" alt=""></div><span>KeepActive</span></div>
    <h1>Keep your screen awake.<br><span>Stay active, quietly.</span></h1>
    <p class="lede">Gentle, human-paced activity for Microsoft Teams on the web, with work schedules and Smart Pause.</p>
    <div class="meta"><span class="dot"></span>LOCAL-ONLY · NO TRACKING</div>
  </div>
  <div class="stage"><div class="device"><img src="raw/popup.png" alt="KeepActive popup"></div></div>
</body>
</html>
