<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<script>
  const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  // Replace the old dark-green K tile inside window [x0,y0,x1,y1] with the new icon.
  async function patch(shotSrc, iconSrc, win) {
    const shot = await load(shotSrc);
    const icon = await load(iconSrc);
    const c = document.createElement('canvas');
    c.width = shot.width; c.height = shot.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(shot, 0, 0);
    const [x0, y0, x1, y1] = win;
    const d = ctx.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let y = 0; y < y1 - y0; y++) for (let x = 0; x < x1 - x0; x++) {
      const k = (y * (x1 - x0) + x) * 4, r = d[k], g = d[k + 1], b = d[k + 2];
      if (r < 45 && g < 90 && g > r + 8 && b < 80) {
        minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
    }
    if (maxX < 0) throw new Error('old icon not found in ' + win);
    const sq = Math.max(maxX - minX + 1, maxY - minY + 1);
    const size = sq * 512 / 464;
    const off = sq * 24 / 464;
    const dx = x0 + minX - off, dy = y0 + minY - off;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(icon, dx - 0.75, dy - 0.75, size + 1.5, size + 1.5);
    return { png: c.toDataURL('image/png'), box: [Math.round(dx), Math.round(dy), Math.round(size)] };
  }
</script>
</body></html>
